<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brylie Wilson</title>
<meta name="description" content="Brylie Wilson. Designer, strategist and chronic over-thinker, systems thinker.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..800;1,62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/site.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js" integrity="sha512-M7nHCiNUOwFt6Us3r8alutZLm9qMt4s9951uo8jqO4UwJ1hziseL6O3ndFyigx6+LREfZqnhHxYjKRJ8ZQ69DQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script type="module" src="/js/main.js"></script>
</head>
<body>
<main class="frame">
  <h1 class="sr-only">Brylie Wilson. Designer, strategist and chronic over-thinker, systems thinker.</h1>
  <svg id="map" class="map" role="group" aria-label="Systems map: works and the keywords that connect them"></svg>

  <nav class="rail" aria-label="Map controls">
    <div class="rail-set" role="group" aria-label="View">
      <button class="cbtn" type="button" data-view="edge" aria-label="Edge map" aria-pressed="true" data-tip="Edge map" data-key="1"><svg class="ic" aria-hidden="true"><use href="/assets/icons.svg#frame"/></svg></button>
      <button class="cbtn" type="button" data-view="force" aria-label="Force" aria-pressed="false" data-tip="Force" data-key="2"><svg class="ic" aria-hidden="true"><use href="/assets/icons.svg#share-2"/></svg></button>
      <button class="cbtn" type="button" data-view="rings" aria-label="Rings" aria-pressed="false" data-tip="Rings" data-key="3"><svg class="ic" aria-hidden="true"><use href="/assets/icons.svg#target"/></svg></button>
    </div>
    <div class="rail-set">
      <!-- TODO(phase 3): Search, Filter, Index and Surprise me join the rail. -->
      <button class="cbtn" type="button" id="btn-layers" aria-label="Labels &amp; lines" aria-expanded="false" aria-controls="pop-layers" data-tip="Labels &amp; lines" data-key="L"><svg class="ic" aria-hidden="true"><use href="/assets/icons.svg#layers"/></svg></button>
    </div>
  </nav>

  <div class="pop" id="pop-layers" role="dialog" aria-label="Labels &amp; lines" hidden>
    <fieldset class="seg">
      <legend class="mono-label">Keyword labels</legend>
      <label><input type="radio" name="labels" value="auto"><span>Auto</span></label>
      <label><input type="radio" name="labels" value="all"><span>All</span></label>
      <label><input type="radio" name="labels" value="off"><span>Off</span></label>
    </fieldset>
    <fieldset class="seg">
      <legend class="mono-label">Lines</legend>
      <label><input type="radio" name="lines" value="all"><span>All</span></label>
      <label><input type="radio" name="lines" value="projects"><span>Projects</span></label>
      <label><input type="radio" name="lines" value="hover"><span>On hover</span></label>
    </fieldset>
  </div>

  <div class="zoomctl" role="group" aria-label="Zoom">
    <button class="cbtn" type="button" id="zoom-in" aria-label="Zoom in" data-tip="Zoom in" data-key="+"><svg class="ic" aria-hidden="true"><use href="/assets/icons.svg#plus"/></svg></button>
    <button class="cbtn" type="button" id="zoom-out" aria-label="Zoom out" data-tip="Zoom out" data-key="−"><svg class="ic" aria-hidden="true"><use href="/assets/icons.svg#minus"/></svg></button>
    <button class="cbtn" type="button" id="zoom-fit" aria-label="Fit" data-tip="Fit" data-key="0"><svg class="ic" aria-hidden="true"><use href="/assets/icons.svg#scan"/></svg></button>
  </div>

  <!-- TODO(phase 3): the index table, so the page works without JS. -->
  <noscript><p class="noscript"><a href="/assets/Wilson_Brylie_Taster-Folio_Final.pdf">Folio PDF</a></p></noscript>
</main>
</body>
</html>
